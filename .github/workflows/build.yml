name: Build WoolShearsBoost

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Extract mod source
        run: |
          unzip -q WoolShearsBoost-source.zip -d source
          ls -la source/WoolShearsBoost

      - name: Add Forge Maven repository
        working-directory: source/WoolShearsBoost
        run: |
          python3 -c "from pathlib import Path; p=Path('build.gradle'); s=p.read_text(); s=s.replace('repositories {}', \"repositories { maven { url = 'https://maven.minecraftforge.net/' } }\"); p.write_text(s)"

      - name: Build mod
        working-directory: source/WoolShearsBoost
        run: gradle --no-daemon build

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: WoolShearsBoost-Forge-1.20.1
          path: source/WoolShearsBoost/build/libs/*.jar
          if-no-files-found: error
